      actionbar: "-1"
      chat: "§aChat enabled!"
    message-off:
      title: "-1"
      subtitle: "-1"
      actionbar: "-1"
      chat: "§cChat disabled! You won't see any messages."
    permission: ""

# Advanced Features
features:
  close-on-click: false

  toggle-cooldown:
    enabled: true
    duration: 2
    message: "§cPlease wait {time} seconds before toggling again!"

  use-actionbar: false

  use-titles:
    enabled: true
    fade-in: 10
    stay: 40
    fade-out: 10

# Messages
messages:
  no-permission: "§cYou don't have permission to use this!"
  no-button-permission: "§cYou don't have permission to toggle this setting!"
  cooldown-active: "§cPlease wait before toggling again!"
  reload-success: "§aConfiguration reloaded successfully!"
  reload-failed: "§cFailed to reload configuration!"
